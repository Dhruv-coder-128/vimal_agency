# Application Configuration
app.name=Vimal Agency
app.version=1.0.0

# Database (PostgreSQL / Supabase)
supabase.db.host=${SUPABASE_DB_HOST:localhost}
supabase.db.port=${SUPABASE_DB_PORT:5432}
supabase.db.name=${SUPABASE_DB_NAME:postgres}
supabase.db.user=${SUPABASE_DB_USER:postgres}
supabase.db.password=${SUPABASE_DB_PASSWORD:}
supabase.db.ssl=${SUPABASE_DB_SSL:require}
